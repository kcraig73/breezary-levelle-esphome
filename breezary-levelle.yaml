esphome:
  name: breezary-levelle
  friendly_name: breezary-levelle

bk72xx:
  board: generic-bk7238-tuya

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: breezary-levell Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

# ============================================================
# GLOBAL STATE
# ============================================================

globals:
  - id: rgb_color_index
    type: int
    restore_value: no
    initial_value: "0"

  - id: rgb_effect_index
    type: int
    restore_value: no
    initial_value: "0"

  - id: rgb_mode
    type: int
    restore_value: no
    initial_value: "1"


# ============================================================
# LOCAL FAN TIMER
#
# This replaces the experimental DP103 timer work.
#
# The countdown runs entirely on the ESP.
# At expiration DP107 is forced OFF.
#
# Any fan OFF, speed, or direction command cancels the timer.
# Lighting controls do not affect the timer.
# ============================================================

script:
  - id: fan_shutdown_timer
    mode: restart

    parameters:
      minutes: int

    then:
      - delay: !lambda |-
          return static_cast<uint32_t>(minutes) * 60000UL;

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_boolean_datapoint_value(107, false);


# ============================================================
# TUYA UART
#
# Production configuration:
# UART byte-level debugging removed.
# ============================================================

uart:
  id: tuya_uart
  rx_pin: RX1
  tx_pin: TX1
  baud_rate: 9600


# ============================================================
# TUYA MCU
# ============================================================

tuya:
  id: tuya_mcu
  uart_id: tuya_uart

  on_datapoint_update:

    # --------------------------------------------------------
    # RGB ACTIVE
    # --------------------------------------------------------

    - sensor_datapoint: 54
      datapoint_type: bool
      then:
        - lambda: |-
            id(rgb_switch).publish_state(x);


    # --------------------------------------------------------
    # WHITE ACTIVE
    # --------------------------------------------------------

    - sensor_datapoint: 63
      datapoint_type: bool
      then:
        - lambda: |-
            id(white_light_switch).publish_state(x);


    # --------------------------------------------------------
    # WHITE BRIGHTNESS
    # --------------------------------------------------------

    - sensor_datapoint: 22
      datapoint_type: uint
      then:
        - lambda: |-
            id(white_brightness).publish_state(x);


    # --------------------------------------------------------
    # WHITE TEMPERATURE
    # --------------------------------------------------------

    - sensor_datapoint: 23
      datapoint_type: uint
      then:
        - lambda: |-
            id(white_temperature).publish_state(x);


    # --------------------------------------------------------
    # RGB MODE
    # --------------------------------------------------------

    - sensor_datapoint: 55
      datapoint_type: enum
      then:
        - lambda: |-
            id(rgb_mode) = static_cast<int>(x);


    # --------------------------------------------------------
    # FAN DIRECTION
    #
    # 0 = Counter-Clockwise
    # 1 = Clockwise
    #
    # Keeps HA synchronized with physical remote changes.
    # A direction command is also considered a manual fan
    # command and therefore cancels the ESP-local timer.
    # --------------------------------------------------------

    - sensor_datapoint: 104
      datapoint_type: enum
      then:
        - lambda: |-
            if (x == 0) {
              id(fan_direction).publish_state("Counter-Clockwise");
            } else if (x == 1) {
              id(fan_direction).publish_state("Clockwise");
            }

            if (id(fan_shutdown_timer).is_running()) {
              id(fan_shutdown_timer).stop();
              id(fan_timer_minutes).publish_state(0);
            }


    # --------------------------------------------------------
    # FAN SPEED
    #
    # Any new speed report represents a fan command and
    # cancels the ESP-local shutdown timer.
    # --------------------------------------------------------

    - sensor_datapoint: 105
      datapoint_type: uint
      then:
        - lambda: |-
            if (id(fan_shutdown_timer).is_running()) {
              id(fan_shutdown_timer).stop();
              id(fan_timer_minutes).publish_state(0);
            }


    # --------------------------------------------------------
    # DP24 = REPORTED/LIVE STATIC RGB COLOR
    #
    # Receive only.
    # Physical remote changes are reported here and keep the
    # ESP color index synchronized.
    # --------------------------------------------------------

    - sensor_datapoint: 24
      datapoint_type: string
      then:
        - lambda: |-
            const std::string c0(
              "\x00\x00\x00\x0C\x00\x00\x00\x03\xE8\x03\xE8", 11);

            const std::string c1(
              "\x00\x00\x00\x0C\x00\x00\x78\x03\xE8\x03\xE8", 11);

            const std::string c2(
              "\x00\x00\x00\x0C\x00\x00\xF0\x03\xE8\x03\xE8", 11);

            const std::string c3(
              "\x00\x00\x00\x0C\x00\x00\x28\x03\xE8\x03\xE8", 11);

            const std::string c4(
              "\x00\x00\x00\x0C\x00\x00\x18\x03\xE8\x03\xE8", 11);

            const std::string c5(
              "\x00\x00\x00\x0C\x00\x00\xA8\x03\xE8\x03\xE8", 11);

            const std::string c6(
              "\x00\x00\x00\x0C\x00\x01\x4A\x03\xE8\x03\xE8", 11);

            if (x == c0) {
              id(rgb_color_index) = 0;
            } else if (x == c1) {
              id(rgb_color_index) = 1;
            } else if (x == c2) {
              id(rgb_color_index) = 2;
            } else if (x == c3) {
              id(rgb_color_index) = 3;
            } else if (x == c4) {
              id(rgb_color_index) = 4;
            } else if (x == c5) {
              id(rgb_color_index) = 5;
            } else if (x == c6) {
              id(rgb_color_index) = 6;
            }


    # --------------------------------------------------------
    # DP25 = REPORTED/LIVE RGB EFFECT
    # --------------------------------------------------------

    - sensor_datapoint: 25
      datapoint_type: string
      then:
        - lambda: |-
            if (x.size() < 3) {
              return;
            }

            const uint8_t a = static_cast<uint8_t>(x[0]);
            const uint8_t b = static_cast<uint8_t>(x[1]);
            const uint8_t c = static_cast<uint8_t>(x[2]);

            if (a == 0x01 && b == 0x17 && c == 0x03) {
              id(rgb_effect_index) = 0;
            } else if (a == 0x01 && b == 0x18 && c == 0x02) {
              id(rgb_effect_index) = 1;
            } else if (a == 0x01 && b == 0x47 && c == 0x05) {
              id(rgb_effect_index) = 2;
            } else if (a == 0x01 && b == 0x49 && c == 0x07) {
              id(rgb_effect_index) = 3;
            } else if (a == 0x01 && b == 0x4B && c == 0x09) {
              id(rgb_effect_index) = 4;
            } else if (a == 0x01 && b == 0x4C && c == 0x0C) {
              id(rgb_effect_index) = 5;
            } else if (a == 0x01 && b == 0x4F && c == 0x0F) {
              id(rgb_effect_index) = 6;
            } else if (a == 0x01 && b == 0x20 && c == 0x0A) {
              id(rgb_effect_index) = 7;
            } else if (a == 0x01 && b == 0x24 && c == 0x0A) {
              id(rgb_effect_index) = 8;
            } else if (a == 0x01 && b == 0x29 && c == 0x02) {
              id(rgb_effect_index) = 9;
            } else if (a == 0x01 && b == 0x00 && c == 0x0A) {
              id(rgb_effect_index) = 10;
            }


# ============================================================
# FAN RUNNING
# ============================================================

binary_sensor:
  - platform: tuya
    id: fan_running
    tuya_id: tuya_mcu
    sensor_datapoint: 107
    internal: true

    on_release:
      - lambda: |-
          if (id(fan_shutdown_timer).is_running()) {
            id(fan_shutdown_timer).stop();
            id(fan_timer_minutes).publish_state(0);
          }


# ============================================================
# NUMERIC CONTROLS
# ============================================================

number:

  # ----------------------------------------------------------
  # WHITE BRIGHTNESS
  # ----------------------------------------------------------

  - platform: template
    name: "White Brightness"
    id: white_brightness
    icon: "mdi:brightness-6"
    min_value: 10
    max_value: 1000
    step: 10
    optimistic: false

    set_action:
      - lambda: |-
          id(tuya_mcu).set_boolean_datapoint_value(54, false);
          id(tuya_mcu).set_boolean_datapoint_value(63, true);
          id(tuya_mcu).set_boolean_datapoint_value(20, true);
          id(tuya_mcu).set_integer_datapoint_value(
            22,
            static_cast<uint32_t>(x)
          );


  # ----------------------------------------------------------
  # WHITE TEMPERATURE
  # ----------------------------------------------------------

  - platform: template
    name: "White Temperature"
    id: white_temperature
    icon: "mdi:thermometer"
    min_value: 0
    max_value: 1000
    step: 10
    optimistic: false

    set_action:
      - lambda: |-
          id(tuya_mcu).set_boolean_datapoint_value(54, false);
          id(tuya_mcu).set_boolean_datapoint_value(63, true);
          id(tuya_mcu).set_boolean_datapoint_value(20, true);
          id(tuya_mcu).set_integer_datapoint_value(
            23,
            static_cast<uint32_t>(x)
          );


  # ----------------------------------------------------------
  # ESP-LOCAL FAN SHUTDOWN TIMER
  #
  # 0 = disabled
  # 1-240 = minutes
  #
  # Setting a new non-zero value starts/restarts the timer.
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Timer Minutes"
    id: fan_timer_minutes
    icon: "mdi:timer-outline"
    min_value: 0
    max_value: 240
    step: 1
    mode: box
    optimistic: true
    restore_value: false
    initial_value: 0

    set_action:
      - if:
          condition:
            lambda: |-
              return x <= 0;
          then:
            - script.stop: fan_shutdown_timer

          else:
            - script.execute:
                id: fan_shutdown_timer
                minutes: !lambda |-
                  return static_cast<int>(x);


# ============================================================
# LIGHTING TOGGLES
# ============================================================

switch:

  - platform: template
    name: "Light"
    id: white_light_switch
    icon: "mdi:ceiling-fan-light"
    optimistic: false

    turn_on_action:
      - lambda: |-
          id(tuya_mcu).set_boolean_datapoint_value(54, false);
          id(tuya_mcu).set_boolean_datapoint_value(63, true);
          id(tuya_mcu).set_boolean_datapoint_value(20, true);

    turn_off_action:
      - lambda: |-
          id(tuya_mcu).set_boolean_datapoint_value(54, false);
          id(tuya_mcu).set_boolean_datapoint_value(63, false);
          id(tuya_mcu).set_boolean_datapoint_value(20, false);


  - platform: template
    name: "RGB"
    id: rgb_switch
    icon: "mdi:palette"
    optimistic: false

    turn_on_action:
      - lambda: |-
          id(tuya_mcu).set_boolean_datapoint_value(54, true);
          id(tuya_mcu).set_boolean_datapoint_value(63, false);
          id(tuya_mcu).set_boolean_datapoint_value(20, true);

      - delay: 100ms

      - lambda: |-
          id(tuya_mcu).force_set_enum_datapoint_value(55, 1);

    turn_off_action:
      - lambda: |-
          id(tuya_mcu).set_boolean_datapoint_value(54, false);
          id(tuya_mcu).set_boolean_datapoint_value(63, false);
          id(tuya_mcu).set_boolean_datapoint_value(20, false);


# ============================================================
# FAN DIRECTION
# ============================================================

select:
  - platform: template
    name: "Fan Direction"
    id: fan_direction
    icon: "mdi:swap-vertical"
    optimistic: false

    options:
      - "Counter-Clockwise"
      - "Clockwise"

    set_action:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);

      - if:
          condition:
            binary_sensor.is_off: fan_running

          then:
            - lambda: |-
                if (x == "Counter-Clockwise") {
                  id(tuya_mcu).force_set_enum_datapoint_value(104, 0);
                } else if (x == "Clockwise") {
                  id(tuya_mcu).force_set_enum_datapoint_value(104, 1);
                }

            - delay: 500ms

            - lambda: |-
                id(tuya_mcu).force_set_boolean_datapoint_value(107, false);

          else:
            - lambda: |-
                if (x == "Counter-Clockwise") {
                  id(tuya_mcu).force_set_enum_datapoint_value(104, 0);
                } else if (x == "Clockwise") {
                  id(tuya_mcu).force_set_enum_datapoint_value(104, 1);
                }


# ============================================================
# BUTTONS
# ============================================================

button:

  # ----------------------------------------------------------
  # FAN OFF
  # ----------------------------------------------------------

  - platform: template
    name: "Fan OFF"
    id: fan_off
    icon: "mdi:fan-off"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_boolean_datapoint_value(107, false);


  # ----------------------------------------------------------
  # SPEED 1
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Speed 1"
    id: fan_speed_1
    icon: "mdi:fan-speed-1"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_integer_datapoint_value(105, 1);

      - delay: 150ms

      - lambda: |-
          id(tuya_mcu).force_set_boolean_datapoint_value(107, true);


  # ----------------------------------------------------------
  # SPEED 2
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Speed 2"
    id: fan_speed_2
    icon: "mdi:fan-speed-1"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_integer_datapoint_value(105, 2);


  # ----------------------------------------------------------
  # SPEED 3
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Speed 3"
    id: fan_speed_3
    icon: "mdi:fan-speed-2"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_integer_datapoint_value(105, 3);


  # ----------------------------------------------------------
  # SPEED 4
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Speed 4"
    id: fan_speed_4
    icon: "mdi:fan-speed-2"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_integer_datapoint_value(105, 4);


  # ----------------------------------------------------------
  # SPEED 5
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Speed 5"
    id: fan_speed_5
    icon: "mdi:fan-speed-3"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_integer_datapoint_value(105, 5);


  # ----------------------------------------------------------
  # SPEED 6
  # ----------------------------------------------------------

  - platform: template
    name: "Fan Speed 6"
    id: fan_speed_6
    icon: "mdi:fan-speed-3"

    on_press:
      - script.stop: fan_shutdown_timer

      - lambda: |-
          id(fan_timer_minutes).publish_state(0);
          id(tuya_mcu).force_set_integer_datapoint_value(105, 6);


  # ==========================================================
  # RGB COLOR
  #
  # DP61 = writable/persistent static RGB color.
  # DP24 remains receive-only.
  # ==========================================================

  - platform: template
    name: "RGB Color"
    id: rgb_color_next
    icon: "mdi:palette"

    on_press:
      - lambda: |-
          const int next = (id(rgb_color_index) + 1) % 7;

          std::vector<uint8_t> raw;

          switch (next) {

            case 0:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x00, 0x00, 0x03, 0xE8, 0x03, 0xE8
              };
              break;

            case 1:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x00, 0x78, 0x03, 0xE8, 0x03, 0xE8
              };
              break;

            case 2:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x00, 0xF0, 0x03, 0xE8, 0x03, 0xE8
              };
              break;

            case 3:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x00, 0x28, 0x03, 0xE8, 0x03, 0xE8
              };
              break;

            case 4:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x00, 0x18, 0x03, 0xE8, 0x03, 0xE8
              };
              break;

            case 5:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x00, 0xA8, 0x03, 0xE8, 0x03, 0xE8
              };
              break;

            case 6:
            default:
              raw = {
                0x00, 0x00, 0x00, 0x0C, 0x00,
                0x01, 0x4A, 0x03, 0xE8, 0x03, 0xE8
              };
              break;
          }

          id(tuya_mcu).force_set_raw_datapoint_value(
            61,
            raw
          );

          id(rgb_color_index) = next;


  # ==========================================================
  # RGB EFFECT
  #
  # DP56 = writable/persistent effect.
  # DP25 remains receive-only.
  # ==========================================================

  - platform: template
    name: "RGB Effect"
    id: rgb_effect_cycle
    icon: "mdi:creation"

    on_press:
      - lambda: |-
          const int next = (id(rgb_effect_index) + 1) % 11;

          std::vector<uint8_t> raw;

          switch (next) {

            case 0:
              raw = {
                0x01, 0x17, 0x03, 0x5E, 0x5E, 0x60, 0x00,
                0x00, 0x64, 0x00, 0x38, 0x2F, 0x00, 0x1E,
                0x5C, 0x00, 0xD5, 0x45, 0x01, 0x1A, 0x64
              };
              break;

            case 1:
              raw = {
                0x01, 0x18, 0x02, 0x64, 0x64, 0xF0, 0x00,
                0x00, 0x64, 0x00, 0xB2, 0x39, 0x01, 0x0A,
                0x64, 0x01, 0x2D, 0x64, 0x01, 0x3F, 0x64
              };
              break;

            case 2:
              raw = {
                0x01, 0x47, 0x05, 0x4D, 0x4D, 0x00, 0x00,
                0x00, 0x64, 0x01, 0x03, 0x45, 0x00, 0xC1,
                0x43
              };
              break;

            case 3:
              raw = {
                0x01, 0x49, 0x07, 0x03, 0x03, 0x00, 0x00,
                0x00, 0x64, 0x00, 0xDA, 0x37, 0x01, 0x52,
                0x41, 0x00, 0x5C, 0x37
              };
              break;

            case 4:
              raw = {
                0x01, 0x4B, 0x09, 0x32, 0x32, 0x00, 0x00,
                0x00, 0x64, 0x01, 0x03, 0x45, 0x00, 0x41,
                0x3A, 0x00, 0x25, 0x4B, 0x00, 0x5E, 0x42
              };
              break;

            case 5:
              raw = {
                0x01, 0x4C, 0x0C, 0x32, 0x32, 0x00, 0x00,
                0x00, 0x64, 0x00, 0xD8, 0x4D, 0x00, 0xC1,
                0x43, 0x01, 0x03, 0x45, 0x00, 0x5C, 0x37
              };
              break;

            case 6:
              raw = {
                0x01, 0x4F, 0x0F, 0x19, 0x19, 0x00, 0x00,
                0x00, 0x64, 0x00, 0xBC, 0x64, 0x00, 0x2D,
                0x4E, 0x00, 0x00, 0x64, 0x00, 0x64, 0x3C
              };
              break;

            case 7:
              raw = {
                0x01, 0x20, 0x0A, 0x55, 0x55, 0x60, 0x00,
                0x00, 0x64, 0x00, 0xC2, 0x58, 0x01, 0x3E,
                0x33, 0x00, 0xFF, 0x46, 0x01, 0x1D, 0x64
              };
              break;

            case 8:
              raw = {
                0x01, 0x24, 0x0A, 0x4B, 0x4B, 0x60, 0x00,
                0x00, 0x64, 0x00, 0xBC, 0x26, 0x00, 0xD6,
                0x55, 0x01, 0x18, 0x64, 0x00, 0xF9, 0x4D
              };
              break;

            case 9:
              raw = {
                0x01, 0x29, 0x02, 0x61, 0x61, 0xE0, 0x00,
                0x00, 0x64, 0x00, 0x0B, 0x64, 0x00, 0xD9,
                0x64, 0x00, 0x2B, 0x64, 0x00, 0x91, 0x64,
                0x00, 0xB9, 0x64
              };
              break;

            case 10:
            default:
              raw = {
                0x01, 0x00, 0x0A, 0x50, 0x50, 0x00, 0x00,
                0x00, 0x64, 0x00, 0x00, 0x64, 0x00, 0x02,
                0x64, 0x00, 0x78, 0x64, 0x00, 0x74, 0x64,
                0x00, 0xE6, 0x64, 0x00, 0xE6, 0x64
              };
              break;
          }

          id(tuya_mcu).force_set_raw_datapoint_value(
            56,
            raw
          );

          id(rgb_effect_index) = next;
